[pytest]
markers =
    user_pass: Username/Password authentication tests
    api_key: API Key authentication tests
# Slowest tests at the end of every run.
addopts = --durations=25
# A test running this long dumps every thread's stack to stderr (it is not killed), so a
# hang shows where it is stuck instead of looking like a slow run.
faulthandler_timeout = 900
